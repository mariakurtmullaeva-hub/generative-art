const COUNT=620,positions=new Float32Array(COUNT*3),sizes=new Float32Array(COUNT),seeds=new Float32Array(COUNT),phases=new Float32Array(COUNT),speedA=new Float32Array(COUNT),speedB=new Float32Array(COUNT),ampA=new Float32Array(COUNT),ampB=new Float32Array(COUNT),driftX=new Float32Array(COUNT),driftY=new Float32Array(COUNT),freqBias=new Float32Array(COUNT),response=new Float32Array(COUNT),baseX=new Float32Array(COUNT),baseY=new Float32Array(COUNT);

const rx=(rand()*2-1),ry=(rand()*2-1);

const smooth={bass:0,mid:0,high:0,energy:0},bands={bass:0,mid:0,high:0,energy:0};let previousBass=0,transient=0,lastBeat=0,dynamicEnvelope=0,slowEnvelope=0,previousEnergy=0,spectralFlux=0;
function average(a,b){let sum=0;for(let i=a;i<b;i++)sum+=freq[i]||0;return sum/Math.max(1,b-a)/255}
function updateAudio(now,dt){
 if(analyser&&freq&&playing){
  analyser.getByteFrequencyData(freq);
  bands.bass=average(1,18);bands.mid=average(18,125);bands.high=average(125,Math.min(380,freq.length));
  bands.energy=(bands.bass*.42+bands.mid*.34+bands.high*.24);

  let flux=0;for(let i=2;i<Math.min(220,freq.length);i++){
   const v=freq[i]/255;const old=previousSpectrum[i]||0;flux+=Math.max(0,v-old);
   previousSpectrum[i]=v;
  }
  spectralFlux=Math.min(1,flux/28);
  for(const k of Object.keys(smooth)){const target=bands[k];const attack=k==='bass'?.68:.42,release=k==='bass'?.16:.105;smooth[k]+=(target-smooth[k])*(target>smooth[k]?attack:release)}
  const bassRise=Math.max(0,bands.bass-previousBass);
  const energyRise=Math.max(0,bands.energy-previousEnergy);

 }
 transient*=Math.exp(-dt/420);
 const instant=Math.min(1.6,smooth.energy*1.7+smooth.bass*1.25+transient*1.15+spectralFlux*.32);
 dynamicEnvelope+=(instant-dynamicEnvelope)*(instant>dynamicEnvelope?.24:.035);
 slowEnvelope+=(smooth.energy-slowEnvelope)*(smooth.energy>slowEnvelope?.028:.009);
 uniforms.uBass.value=smooth.bass;uniforms.uMid.value=smooth.mid;uniforms.uHigh.value=smooth.high;uniforms.uEnergy.value=Math.min(1,smooth.energy+transient*.3);uniforms.uTime.value=now*.001;
}
const previousSpectrum=new Float32Array(512);
function updateParticlePositions(t,dt){if(!playing)return;const dyn=Math.min(1.5,dynamicEnvelope),slow=slowEnvelope;const dtScale=Math.min(2,dt/16.67);
 // Forms emerge and dissolve slowly, while the entire field keeps travelling across the canvas.
 const cycle=(t%26)/26;
 const ringWeight=Math.max(0,1-Math.abs(cycle-.27)/.22);
 const waveWeight=Math.max(0,1-Math.abs(cycle-.70)/.23);
 // Audio accents briefly loosen the formation; quiet passages let it become legible again.
 const formBase=Math.max(ringWeight,waveWeight)*(.48+Math.min(.22,slow*.7));
 const shapeWeight=formBase*(1-Math.min(.68,dyn*.46));
 for(let i=0;i<COUNT;i++){
  const a=phases[i],s=seeds[i],r=response[i];
  const w1=t*(.10+speedA[i]*.18)+a;
  const w2=t*(.08+speedB[i]*.13)+a*2.31;
  const wanderX=Math.sin(w1)*innerWidth*(.12+.11*s)+Math.sin(w2*.71+a)*innerWidth*.045;
  const wanderY=Math.cos(w2)*innerHeight*(.12+.10*s)+Math.sin(w1*.63+a*1.7)*innerHeight*.055;
  const audioMotion=(ampA[i]+ampB[i]*.8)*(0.12+dyn*1.7)*r;
  const freeX=baseX[i]*innerWidth*.44+wanderX+Math.sin(t*(.55+speedB[i])+a*1.3)*audioMotion;
  const freeY=baseY[i]*innerHeight*.43+wanderY+Math.cos(t*(.48+speedA[i])+a*.8)*audioMotion*.72;
  const angle=(i/COUNT)*Math.PI*2+a*.13;
  const radius=Math.min(innerWidth,innerHeight)*(.18+.13*s);
  const ringX=Math.cos(angle+t*.045)*radius+Math.sin(t*.24+a)*innerWidth*.018;
  const ringY=Math.sin(angle+t*.045)*radius*.82+Math.cos(t*.21+a*1.7)*innerHeight*.018;
  const waveX=((i/COUNT)-.5)*innerWidth*.78;
  const waveY=Math.sin(waveX*.009+t*.48+a*.18)*innerHeight*.17+Math.sin(waveX*.018-t*.27+a)*innerHeight*.045;
  const shapeX=ringWeight>=waveWeight?ringX:waveX;
  const shapeY=ringWeight>=waveWeight?ringY:waveY;
  const targetX=freeX*(1-shapeWeight)+shapeX*shapeWeight;
  const targetY=freeY*(1-shapeWeight)+shapeY*shapeWeight;
  const idx=i*3;

  const kick=(transient*.9+dyn*.18)*r;

  positions[idx+1]+=(targetY+vy-positions[idx+1])*blend;

}

const play=document.querySelector('#play'),state=document.querySelector('#state'),note=document.querySelector('#note'),hint=document.querySelector('#hint'),count=document.querySelector('#countdown'),seek=document.querySelector('#seek'),time=document.querySelector('#time');

async function setupAudio(){if(!started){ac=new AudioContext({latencyHint:'interactive'});analyser=ac.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.28;src=ac.createMediaElementSource(audio);src.connect(analyser);analyser.connect(ac.destination);freq=new Uint8Array(analyser.frequencyBinCount);started=true}if(ac.state==='suspended')await ac.resume();if(audio.error)throw new Error('Audio file error '+audio.error.code)}
