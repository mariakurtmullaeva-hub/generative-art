const scene=new THREE.Scene();scene.background=new THREE.Color('#03020a');const camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,.1,10);camera.position.z=2;
const COUNT=620,positions=new Float32Array(COUNT*3),sizes=new Float32Array(COUNT),seeds=new Float32Array(COUNT),phases=new Float32Array(COUNT),speedA=new Float32Array(COUNT),speedB=new Float32Array(COUNT),ampA=new Float32Array(COUNT),ampB=new Float32Array(COUNT),driftX=new Float32Array(COUNT),driftY=new Float32Array(COUNT),freqBias=new Float32Array(COUNT),response=new Float32Array(COUNT),baseX=new Float32Array(COUNT),baseY=new Float32Array(COUNT);

const pointsMaterial=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms,vertexShader:`attribute float aSize;attribute float aSeed;uniform float uTime,uBass,uMid,uHigh,uEnergy,uSize;varying float vAlpha;varying float vSeed;void main(){vec3 p=position;float t=uTime;vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(aSize*uSize*(1.+uHigh*.9+uBass*.3),1.,5.5);vAlpha=(.48+aSeed*.48)*(.72+uEnergy*.55);vSeed=aSeed;}`,fragmentShader:`precision highp float;uniform float uHigh,uEnergy;varying float vAlpha;varying float vSeed;void main(){vec2 q=gl_PointCoord-.5;float r=length(q);if(r>.5)discard;float core=1.-smoothstep(.18,.31,r);float rim=1.-smoothstep(.31,.49,r);vec3 c=mix(vec3(.52,.30,.91),vec3(.94,.90,1.),smoothstep(.12,.88,vSeed));gl_FragColor=vec4(c,(core*.95+rim*.18)*vAlpha);}`});

let ac,analyser,freq,src,started=false,playing=false,counting=false,hasPlayed=false;
// Audio-driven controls: measure frequency bands in Hz (not arbitrary FFT-bin ranges),
// track their moving baseline, and detect bass onsets rather than running a visual timer.
const smooth={bass:0,mid:0,high:0,energy:0},bands={bass:0,mid:0,high:0,energy:0};
let bassFloor=0,prevBass=0,bassHit=0,beatCooldown=0,energyEnvelope=0;
function bandRms(loHz,hiHz){
 if(!freq||!analyser)return 0;
 const hzPerBin=ac.sampleRate/analyser.fftSize;
 const first=Math.max(1,Math.floor(loHz/hzPerBin));
 const last=Math.min(freq.length-1,Math.ceil(hiHz/hzPerBin));
 if(last<=first)return 0;
 let sum=0,n=0;
 for(let i=first;i<=last;i++){const v=(freq[i]||0)/255;sum+=v*v;n++;}
 return Math.sqrt(sum/Math.max(1,n));

function updateAudio(now,dt){
 if(analyser&&freq&&playing){
  analyser.getByteFrequencyData(freq);

  bands.bass=Math.min(1,bandRms(35,150)*3.1);
  bands.mid=Math.min(1,bandRms(150,1800)*4.0);
  bands.high=Math.min(1,bandRms(1800,9000)*5.2);

  for(const k of Object.keys(smooth)){
   const target=bands[k];
   const tau=target>smooth[k]?(k==='bass'?.035:.055):(k==='bass'?.22:.30);
   const alpha=1-Math.exp(-sec/tau);
   smooth[k]+=(target-smooth[k])*alpha;
  }

  bassFloor+=(smooth.bass-bassFloor)*(smooth.bass>bassFloor?.012:.055);

  const onset=Math.max(0,smooth.bass-bassFloor);
  if(beatCooldown<=0 && rise>.035 && onset>.045){
   bassHit=Math.min(1,bassHit+.45+rise*3.5+onset*1.2);
   beatCooldown=0.105;
  }
  prevBass=smooth.bass;
  beatCooldown=Math.max(0,beatCooldown-sec);
  bassHit*=Math.exp(-sec/.24);

 }else if(!playing){

 }

 uniforms.uMid.value=smooth.mid;
 uniforms.uHigh.value=smooth.high;
 uniforms.uEnergy.value=smooth.energy;

function updateParticlePositions(t,dt){if(!playing)return;const bass=smooth.bass,mid=smooth.mid,high=smooth.high,energy=energyEnvelope,hit=bassHit;const dtScale=Math.min(2,dt/16.67);
 // Shape windows retain the v11 aesthetic, while their visibility breathes with the audio.
 const cycle=(t%30)/30;
 const ringWeight=Math.max(0,1-Math.abs(cycle-.30)/.19);
 const waveWeight=Math.max(0,1-Math.abs(cycle-.72)/.20);
 const shapeWeight=Math.max(ringWeight,waveWeight)*(.48+Math.max(0,.34-energy*.22));
 // Quiet passages gather the field; louder passages open it. No independent pulsing oscillator.
 const spread=.66+energy*.72+bass*.24+hit*.18;
 const motionGain=.42+energy*1.35+bass*.75+hit*1.55;
 for(let i=0;i<COUNT;i++){
  const a=phases[i],s=seeds[i],r=response[i];

  const dynamicT=t*(.12+speedB[i]*(.20+motionGain*.34))+a*1.7;

  const freeX=baseX[i]*innerWidth*.49+Math.sin(individualT)*localAmp+Math.sin(dynamicT*.63+a)*ampB[i]*(.12+high*.18+hit*.18);
  const freeY=baseY[i]*innerHeight*.48+Math.cos(t*speedB[i]*(.55+motionGain*.6)+a*1.31)*(ampA[i]*.48+bass*ampB[i]*.85+hit*ampB[i]*.8)+Math.sin(dynamicT+a*.4)*ampA[i]*(.25+mid*.30);
  const angle=(i/COUNT)*Math.PI*2+a*.11;
  const radius=Math.min(innerWidth,innerHeight)*(.16+.10*s)*(1+bass*.18+hit*.20);
  const ringX=Math.cos(angle+t*(.025+bass*.08+hit*.12))*radius+Math.sin(t*(.28+mid*.25)+a)*8;
  const ringY=Math.sin(angle+t*(.025+bass*.08+hit*.12))*radius*.72+Math.cos(t*.31+a*1.7)*7;
  const waveX=((i/COUNT)-.5)*innerWidth*.68;
  const waveY=Math.sin(waveX*.012+t*(.48+mid*.35+bass*.45)+a*.22)*innerHeight*(.085+bass*.045+hit*.055)+Math.sin(waveX*.024-t*.38+a)*innerHeight*.035;

  const shapeY=ringWeight>=waveWeight?ringY:waveY;

  const jitterX=Math.sin(t*(5+high*12)+a*2.3)*high*(2+7*r)+Math.cos(t*2.1+a)*hit*driftX[i]*24;
  const jitterY=Math.cos(t*(4+high*10)+a*1.9)*high*(2+7*r)+Math.sin(t*2.4+a)*hit*driftY[i]*24;

const play=document.querySelector('#play'),state=document.querySelector('#state'),note=document.querySelector('#note'),hint=document.querySelector('#hint'),count=document.querySelector('#countdown'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
