<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05020b">
<title>Liminal Bloom — Max Vue · Psychedelic Transform</title>
<style>
:root{color-scheme:dark;--ink:#f5efff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03020a;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(2,1,8,.25) 75%,rgba(2,1,8,.76) 100%)}
.top{position:fixed;left:clamp(20px,4vw,54px);right:clamp(20px,4vw,54px);top:clamp(20px,4vh,40px);display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.28em;color:#c0a6e8}.title{font-size:clamp(20px,2.4vw,30px);font-weight:300;letter-spacing:.04em;margin-top:9px}.sub{font-size:11px;color:#a79bbd;margin-top:6px;letter-spacing:.08em}.pill{border:1px solid #ffffff28;border-radius:99px;padding:9px 12px;color:#d4cbe1;background:#ffffff08;font-size:10px;letter-spacing:.12em}
.center-note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .45s;width:100%}.center-note .tiny{font-size:9px;letter-spacing:.28em;color:#f0e6ff;text-shadow:0 0 22px #d4aaff}.center-note .hint{font-size:11px;color:#b9a9cc;margin-top:12px;letter-spacing:.08em}
#countdown{font-size:clamp(64px,14vw,150px);font-weight:200;letter-spacing:-.06em;color:#fff7ff;text-shadow:0 0 50px #c99aff;line-height:1;opacity:0;transform:scale(.8);transition:opacity .22s,transform .22s}#countdown.show{opacity:1;transform:scale(1)}
.bottom{position:fixed;left:clamp(20px,4vw,54px);right:clamp(20px,4vw,54px);bottom:clamp(20px,4vh,38px);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}.track-name{font-size:12px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-sub{font-size:10px;color:#a79bbd;margin-top:5px;letter-spacing:.1em}.controls{display:flex;align-items:center;gap:9px}.btn{appearance:none;border:1px solid #ffffff30;background:#ffffff0b;color:#f5efff;border-radius:99px;padding:12px 16px;font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(14px)}.btn:hover{background:#ffffff18;border-color:#ffffff65}.btn.primary{background:#eee6fa;color:#171020;border-color:#eee6fa}
#seek{position:fixed;bottom:0;left:0;width:100%;height:2px;appearance:none;background:#ffffff18;outline:none;cursor:pointer}#seek::-webkit-slider-thumb{appearance:none;width:5px;height:5px;border-radius:50%;background:#eee4ff}
@media(max-width:600px){.bottom{grid-template-columns:1fr;gap:12px}.controls{justify-content:flex-start}.btn{padding:11px 13px}.pill{font-size:8px}}
</style></head><body>
<canvas id="scene"></canvas><div class="vignette"></div>
<header class="top"><div><div class="eyebrow">AN AUDIO-REACTIVE WORLD</div><div class="title">Liminal Bloom</div><div class="sub">ONE TRACK · MANY FLUID FORMS</div></div><div class="pill" id="state">DORMANT / 01</div></header>
<div class="center-note" id="note"><div id="countdown">3</div><div class="tiny" id="note-title">A FLUID WORLD</div><div class="hint" id="hint">Press enter to begin</div></div>
<footer class="bottom"><div><div class="track-name">Max Vue — Psychedelic Transform</div><div class="track-sub" id="time">00:00 / 00:00</div></div><div class="controls"><button class="btn" id="fullscreen" aria-label="Fullscreen">⛶</button><button class="btn" id="restart">↺</button><button class="btn primary" id="play">▶ &nbsp; ENTER</button></div></footer>
<input id="seek" type="range" min="0" max="1" value="0" step=".1" aria-label="Track position"><audio id="audio" src="./track.mp3" preload="metadata" crossorigin="anonymous"></audio>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene'),audio=document.querySelector('#audio');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();scene.background=new THREE.Color('#03020a');const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const uniforms={uTime:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},uBass:{value:0},uMid:{value:0},uHigh:{value:0},uEnergy:{value:0},uPlay:{value:0}};
const material=new THREE.ShaderMaterial({uniforms,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,fragmentShader:`
precision highp float; varying vec2 vUv;
uniform vec2 uRes;uniform float uTime,uBass,uMid,uHigh,uEnergy,uPlay;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return v;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdRoundBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
void main(){
 vec2 screen=(gl_FragCoord.xy-.5*uRes)/uRes.y;
 // Compact art-directed composition: keep the fluid sculpture in the middle 60% of the viewport.
 vec2 uv=screen/.68;
 float t=uTime*.14;
 // Slowly advected domain warping. Keep contour frequency high enough to read as liquid, not fog.
 vec2 p=uv;
 float warp0=fbm(p*2.8+vec2(t*.25,-t*.16));
 for(int i=0;i<4;i++){float fi=float(i);p=rot(.13*sin(t+fi*.7)+.07*cos(t*.6-fi))*p;p+=.075*vec2(sin(p.y*4.4+t+fi),cos(p.x*4.1-t*.8+fi))*(.7+uMid*.8);}
 float f1=fbm(p*3.6+vec2(t*.13,-t*.09));
 float f2=fbm(p*7.5-vec2(t*.17,t*.12));
 float f3=fbm(p*14.0+vec2(t*.22,-t*.19));
 // Several overlapping organic lobes; distance-like contours produce crisp edges.
 vec2 c1=p-vec2(-.30+.045*sin(t*.7),.08+.05*cos(t*.55));
 vec2 c2=rot(.65*sin(t*.42))*(p-vec2(.22+.06*sin(t*.5),-.16+.04*cos(t*.7)));
 vec2 c3=rot(-.8+.22*sin(t*.31))*(p-vec2(.02,.29+.035*sin(t*.6)));
 float d1=length(c1/vec2(.48,.34))-1.0;
 float d2=length(c2/vec2(.39,.27))-1.0;
 float d3=length(c3/vec2(.27,.43))-1.0;
 float metab=min(d1,min(d2,d3));
 float contourWarp=(f1-.5)*.22+(f2-.5)*.09+(f3-.5)*.025;
 float d=metab+contourWarp+(.025+.025*uBass)*sin(p.x*5.+p.y*3.+t+f2*4.);
 float edge=1.0-smoothstep(.005,.035,abs(d));
 float body=smoothstep(.10,-.04,d);
 float innerRim=exp(-abs(d+.085+uBass*.018)*65.);
 float outerRim=exp(-abs(d-.015)*95.);
 float fineRim=exp(-abs(d+.025)*155.);
 float flowingStripes=pow(max(0.,sin((f1*1.3+f2*.6+f3*.2)*24.+t*1.1)),8.)*body;
 float caustic=pow(max(0.,sin((f1+f2*.5)*27.-t+f3*2.)),14.)*body;
 float spec=pow(max(0.,sin((f1*1.1+f2*.3)*20.+t*.8)),20.)*outerRim;
 // glossy dark-violet body with narrow lavender/pearl highlights
 vec3 col=vec3(.004,.002,.012);
 float inside=body*(.35+.65*f1);
 col+=inside*vec3(.045,.008,.14);
 col+=inside*vec3(.12,.018,.37)*f2*.8;
 col+=vec3(.25,.035,.61)*innerRim*(.45+uBass*.45);
 col+=vec3(.47,.19,.78)*outerRim*(.5+uHigh*.35);
 col+=vec3(.81,.64,.96)*fineRim*(.45+uHigh*.65);
 col+=vec3(.98,.86,1.)*spec*(.12+uHigh*.8);
 col+=vec3(.45,.17,.66)*flowingStripes*(.08+uMid*.35);
 col+=vec3(.94,.75,1.)*caustic*(.04+uHigh*.25);
 // secondary fluid ribbons with firm highlights, softly displaced edges
 float ribbon1=abs(p.y-(.22*sin(p.x*3.2+t*.4)+.10*sin(p.x*6.-t)+.08*(f1-.5)));
 float ribbon2=abs(p.x-(-.18+.20*sin(p.y*3.+t*.35)+.06*sin(p.y*7.+t)));
 float r1=exp(-ribbon1*38.)*smoothstep(1.5,.15,length(p));
 float r2=exp(-ribbon2*42.)*smoothstep(1.4,.2,length(p));
 col+=vec3(.15,.025,.34)*r1*.22+vec3(.34,.10,.53)*r2*.18;
 col+=vec3(.74,.62,.91)*(exp(-ribbon1*100.)+exp(-ribbon2*115.))*(.05+uHigh*.18)*smoothstep(1.4,.2,length(p));
 // Smooth background remains truly dark; no fullscreen fog layer.
 float vign=1.-smoothstep(.75,1.55,length(screen));col*=vign;
 col=pow(max(col,vec3(0.)),vec3(.82));
 gl_FragColor=vec4(col,1.);
}`});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));
let ac,analyser,freq,src,started=false,playing=false,counting=false,hasPlayed=false;
const smooth={bass:0,mid:0,high:0,energy:0};
function average(a,b){let sum=0;for(let i=a;i<b;i++)sum+=freq[i]||0;return sum/Math.max(1,b-a)/255}
function updateAudio(){if(analyser&&freq&&playing){analyser.getByteFrequencyData(freq);const raw={bass:average(1,14),mid:average(14,100),high:average(100,Math.min(320,freq.length))};raw.energy=(raw.bass+raw.mid+raw.high)/3;for(const k in raw)smooth[k]+=(raw[k]-smooth[k])*(k==='bass'?.18:.10)}for(const k of ['bass','mid','high','energy'])uniforms['u'+k[0].toUpperCase()+k.slice(1)].value=smooth[k]}
function frame(ms){requestAnimationFrame(frame);uniforms.uTime.value=ms*.001;updateAudio();renderer.render(scene,camera)}requestAnimationFrame(frame);
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);uniforms.uRes.value.set(innerWidth,innerHeight)}addEventListener('resize',resize);
const play=document.querySelector('#play'),state=document.querySelector('#state'),note=document.querySelector('#note'),hint=document.querySelector('#hint'),count=document.querySelector('#countdown'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration||1;time.textContent='00:00 / '+fmt(audio.duration)});
audio.addEventListener('timeupdate',()=>{if(!seek.matches(':active'))seek.value=audio.currentTime;time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)});
audio.addEventListener('error',()=>{state.textContent='TRACK ERROR';hint.textContent='Could not load track.mp3 — check file path'});
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function setupAudio(){if(!started){ac=new AudioContext();analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.88;src=ac.createMediaElementSource(audio);src.connect(analyser);analyser.connect(ac.destination);freq=new Uint8Array(analyser.frequencyBinCount);started=true}if(ac.state==='suspended')await ac.resume();if(audio.error)throw new Error('Audio file error '+audio.error.code)}
async function startFirstTime(){if(counting)return;counting=true;try{await setupAudio();note.style.opacity=1;document.querySelector('#note-title').textContent='ENTER THE FLUID';hint.textContent='Take a breath';audio.volume=0;await audio.play();for(let n=3;n>=1;n--){count.textContent=n;count.classList.add('show');await sleep(760);count.classList.remove('show');await sleep(220)}count.textContent='';audio.currentTime=0;audio.volume=1;playing=true;hasPlayed=true;uniforms.uPlay.value=1;state.textContent='IN MOTION / 02';note.style.opacity=0;play.innerHTML='Ⅱ &nbsp; PAUSE'}catch(e){console.error(e);state.textContent='AUDIO ERROR';note.style.opacity=1;document.querySelector('#note-title').textContent='AUDIO UNAVAILABLE';hint.textContent=(e.name||'Error')+': '+(e.message||'could not start playback')}finally{counting=false}}
play.addEventListener('click',async()=>{if(counting)return;if(playing){audio.pause();playing=false;play.innerHTML='▶ &nbsp; RESUME';state.textContent='SUSPENDED / 02';note.style.opacity=1;count.classList.remove('show');count.textContent='';document.querySelector('#note-title').textContent='FLUID AT REST';hint.textContent='Paused — resume when ready';return}if(hasPlayed&&!audio.ended){try{await setupAudio();await audio.play();playing=true;uniforms.uPlay.value=1;state.textContent='IN MOTION / 02';note.style.opacity=0;play.innerHTML='Ⅱ &nbsp; PAUSE'}catch(e){state.textContent='AUDIO ERROR';hint.textContent=(e.name||'Error')+': '+(e.message||'could not resume')}return}if(audio.ended)audio.currentTime=0;await startFirstTime()});
audio.addEventListener('ended',()=>{playing=false;hasPlayed=false;play.innerHTML='↺ &nbsp; REPLAY';state.textContent='RESTING / 03';note.style.opacity=1;document.querySelector('#note-title').textContent='THE FLUID SETTLES';hint.textContent='Press replay when you are ready';uniforms.uPlay.value=0});
document.querySelector('#restart').addEventListener('click',()=>{if(counting)return;audio.pause();audio.currentTime=0;audio.volume=1;playing=false;hasPlayed=false;play.innerHTML='▶ &nbsp; ENTER';state.textContent='DORMANT / 01';note.style.opacity=1;count.classList.remove('show');count.textContent='';document.querySelector('#note-title').textContent='A FLUID WORLD';hint.textContent='Press enter to begin';uniforms.uPlay.value=0});
seek.addEventListener('input',()=>{audio.currentTime=Number(seek.value)});
document.querySelector('#fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}});
</script></body></html>
